[package]
name = "lenso-module-content-vault"
version = "0.1.1"
edition.workspace = true
license.workspace = true
description = "First-party immutable content vault Module for the Lenso backend framework."
repository = "https://github.com/LioRael/lenso-content-vault-plugin"
homepage = "https://github.com/LioRael/lenso-content-vault-plugin"
readme = "../../README.md"
categories = ["web-programming", "development-tools"]
keywords = ["backend", "framework", "upload", "content-addressed"]
rust-version.workspace = true

[lib]
name = "content_vault"
path = "src/lib.rs"

[features]
default = []
postgres-acceptance = []
s3-acceptance = ["s3"]
s3 = ["object_store/aws"]

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
image.workspace = true
lenso.workspace = true
object_store.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
lenso-bootstrap = "0.1.34"
platform-core = { package = "lenso-platform-core", version = "0.1.25" }

[lints]
workspace = true
