name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: content_vault_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d content_vault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: true
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://127.0.0.1:9000
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_VIRTUAL_HOSTED_STYLE_REQUEST: false
      CONTENT_VAULT_S3_BUCKET: content-vault-test
      CONTENT_VAULT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/content_vault_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Start isolated S3-compatible test storage
        run: |
          docker run --detach --rm --name content-vault-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in {1..30}; do
            if docker run --rm --network host \
              --env MC_HOST_acceptance=http://minioadmin:minioadmin@127.0.0.1:9000 \
              minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 \
              mb --ignore-existing acceptance/content-vault-test; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Verify generated Capability freshness and removed Host boundary
        run: |
          cargo check --locked -p lenso-capability-content-vault
          cargo test --locked -p lenso-content-vault-plugin --all-features --doc
          cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json, sys
          package = next(item for item in json.load(sys.stdin)["packages"] if item["name"] == "lenso-content-vault-plugin")
          assert not [target for target in package["targets"] if "test" in target["kind"]]
          '
          if rg -n 'lenso::(host|platform)|HostLinkedModule|pub mod test_support' crates/content-vault/src README.md docs; then
            exit 1
          fi
          if rg -n '/Users/|\.worktrees/' README.md docs crates; then
            exit 1
          fi
      - name: Run all tests, including PostgreSQL and S3 acceptance
        run: cargo test --locked --workspace --all-features
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Verify package contents
        run: |
          cargo package --locked -p lenso-capability-content-vault --list
          cargo package --locked -p lenso-content-vault-plugin --list
      - name: Stop isolated S3-compatible test storage
        if: always()
        run: docker rm --force content-vault-minio || true
