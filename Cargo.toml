[workspace]
resolver = "2"
members = [
    "crates/content-vault",
    "crates/lenso-capability-content-vault",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-content-vault-plugin"
rust-version = "1.94"

[workspace.dependencies]
async-trait = "0.1"
async-stream = "0.3"
base64 = "0.22"
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lenso = "0.5.0"
lenso-app-plan = "0.3.0"
lenso-capability-secrets = "0.1.2"
lenso-contract-authoring = "0.1.1"
lenso-contract-codegen = "=0.6.4"
lenso-contract-runtime = "0.1.3"
lenso-kernel = "0.2.0"
lenso-native-adapter = "0.3.0"
lenso-plugin-authoring = "0.1.1"
lenso-postgres-kit = "0.1.0"
object_store = { version = "0.12", default-features = false }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "derive", "json", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
url = "2.5"
uuid = { version = "1.19", features = ["serde", "v7"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
