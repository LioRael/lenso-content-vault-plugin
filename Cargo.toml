[workspace]
resolver = "2"
members = ["crates/content-vault"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
async-trait = "0.1"
async-stream = "0.3"
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lenso = { version = "0.3.44", features = ["host"] }
object_store = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "json", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["io-util", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1.19", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
